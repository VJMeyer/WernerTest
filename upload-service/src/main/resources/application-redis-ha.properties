# Production Application Properties with Redis Sentinel HA
# To use this profile: java -jar app.jar --spring.profiles.active=redis-ha

# Server Configuration
server.port=8080
spring.application.name=upload-service

# Java 21 Virtual Threads Configuration
spring.threads.virtual.enabled=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
upload.directory=/app/uploads

# TUS Protocol Configuration (Resumable Uploads)
tus.upload.directory=/app/tus-uploads
tus.upload.expiration.period=86400000
tus.max.upload.size=104857600

# Redis Sentinel Configuration (High Availability)
# Sentinel automatically handles failover to replica if master fails
spring.data.redis.sentinel.master=mymaster
spring.data.redis.sentinel.nodes=redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
spring.data.redis.password=redis_password
spring.data.redis.timeout=60000
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# For production with external Redis Sentinel cluster, use:
# spring.data.redis.sentinel.nodes=sentinel1.prod.local:26379,sentinel2.prod.local:26379,sentinel3.prod.local:26379

# RabbitMQ Configuration
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# HA Configuration - Publisher Confirms & Message Persistence
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Custom RabbitMQ Properties
rabbitmq.queue.file-upload=file.upload.queue
rabbitmq.exchange.file-processing=file.processing.exchange
rabbitmq.routing.key.file-upload=file.upload

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.de.kisters.hmt.cloud=INFO
logging.level.org.springframework.amqp=INFO
logging.level.org.springframework.data.redis=DEBUG
