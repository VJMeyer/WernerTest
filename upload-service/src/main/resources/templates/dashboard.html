<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Dashboard - File Processing System</title>
</head>
<body>
    <div layout:fragment="content" x-data="dashboardApp()">
        <!-- Welcome Header -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">
                Welcome back, <span th:text="${username}">User</span>!
            </h1>
            <p class="mt-2 text-gray-600">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-blue-100 text-blue-800">
                    <svg class="w-4 h-4 mr-1.5" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3 3 0 013.75-2.906z"/>
                    </svg>
                    <span th:text="${organization}">Organization</span>
                </span>
            </p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- File Upload Card (2/3 width on large screens) -->
            <div class="lg:col-span-2">
                <div class="bg-white rounded-lg shadow-md p-6">
                    <h2 class="text-xl font-semibold text-gray-900 mb-4">Upload File</h2>

                    <!-- Upload Form with HTMX -->
                    <form
                        hx-post="/htmx/upload"
                        hx-encoding="multipart/form-data"
                        hx-target="#upload-result"
                        hx-indicator="#upload-spinner"
                        @htmx:xhr:loadstart="uploadStarted()"
                        @htmx:xhr:loadend="uploadFinished()"
                    >
                        <!-- Drag and Drop Zone -->
                        <div
                            @dragover.prevent="dragOver = true"
                            @dragleave.prevent="dragOver = false"
                            @drop.prevent="handleDrop($event)"
                            :class="{ 'drag-over': dragOver }"
                            class="border-2 border-dashed border-gray-300 rounded-lg p-12 text-center transition-all duration-200 hover:border-gray-400"
                        >
                            <svg class="mx-auto h-16 w-16 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                            </svg>

                            <div class="mb-4">
                                <label for="file-input" class="cursor-pointer">
                                    <span class="text-primary-600 hover:text-primary-500 font-medium">Choose a file</span>
                                    <span class="text-gray-500"> or drag and drop</span>
                                </label>
                                <input
                                    id="file-input"
                                    name="file"
                                    type="file"
                                    class="hidden"
                                    @change="fileSelected($event)"
                                    accept=".csv,.txt,.pdf,.xlsx"
                                >
                            </div>

                            <p class="text-sm text-gray-500">
                                CSV, TXT, PDF, XLSX up to 100MB
                            </p>

                            <!-- Selected File Info -->
                            <div x-show="selectedFile" x-cloak class="mt-4 p-4 bg-gray-50 rounded-lg">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center">
                                        <svg class="h-8 w-8 text-gray-400 mr-3" fill="currentColor" viewBox="0 0 20 20">
                                            <path fill-rule="evenodd" d="M8 4a3 3 0 00-3 3v4a5 5 0 0010 0V7a1 1 0 112 0v4a7 7 0 11-14 0V7a5 5 0 0110 0v4a3 3 0 11-6 0V7a1 1 0 012 0v4a1 1 0 102 0V7a3 3 0 00-3-3z" clip-rule="evenodd"/>
                                        </svg>
                                        <div class="text-left">
                                            <p class="text-sm font-medium text-gray-900" x-text="selectedFileName"></p>
                                            <p class="text-xs text-gray-500" x-text="selectedFileSize"></p>
                                        </div>
                                    </div>
                                    <button
                                        @click.prevent="clearFile()"
                                        class="text-gray-400 hover:text-gray-600"
                                    >
                                        <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                                            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Upload Button -->
                        <div class="mt-6 flex justify-end">
                            <button
                                type="submit"
                                :disabled="!selectedFile || uploading"
                                class="inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-md text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 disabled:opacity-50 disabled:cursor-not-allowed transition"
                            >
                                <span x-show="!uploading">Upload File</span>
                                <span x-show="uploading" class="flex items-center">
                                    <svg id="upload-spinner" class="animate-spin h-5 w-5 mr-3" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/>
                                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
                                    </svg>
                                    Uploading...
                                </span>
                            </button>
                        </div>
                    </form>

                    <!-- Upload Result -->
                    <div id="upload-result" class="mt-6"></div>
                </div>
            </div>

            <!-- Quick Stats Card -->
            <div class="space-y-6">
                <!-- User Info Card -->
                <div class="bg-white rounded-lg shadow-md p-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">Your Account</h3>
                    <div class="space-y-3">
                        <div class="flex items-center text-sm">
                            <svg class="h-5 w-5 text-gray-400 mr-3" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/>
                            </svg>
                            <span class="text-gray-600" th:text="${username}">Username</span>
                        </div>
                        <div class="flex items-center text-sm">
                            <svg class="h-5 w-5 text-gray-400 mr-3" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/>
                                <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/>
                            </svg>
                            <span class="text-gray-600" th:text="${email}">email@example.com</span>
                        </div>
                        <div class="flex items-center text-sm">
                            <svg class="h-5 w-5 text-gray-400 mr-3" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3 3 0 013.75-2.906z"/>
                            </svg>
                            <span class="text-gray-600" th:text="${organization}">Organization</span>
                        </div>
                        <div class="pt-3 border-t border-gray-200">
                            <div class="flex flex-wrap gap-1">
                                <span th:each="role : ${roles}"
                                      th:text="${role}"
                                      class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
                                    Role
                                </span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Quick Links -->
                <div class="bg-white rounded-lg shadow-md p-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">Quick Links</h3>
                    <div class="space-y-2">
                        <a href="/profile" class="flex items-center text-sm text-gray-700 hover:text-primary-600 transition">
                            <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                            Profile Settings
                        </a>
                        <a th:if="${isAdmin}" href="/admin" class="flex items-center text-sm text-gray-700 hover:text-primary-600 transition">
                            <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
                            </svg>
                            Admin Dashboard
                        </a>
                        <a th:if="${isAdmin}" href="http://localhost:8180/admin" target="_blank" class="flex items-center text-sm text-gray-700 hover:text-primary-600 transition">
                            <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                            Keycloak Admin
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Active Uploads Section -->
        <div id="active-uploads" class="mt-8"></div>

    </div>

    <script>
        function dashboardApp() {
            return {
                selectedFile: null,
                selectedFileName: '',
                selectedFileSize: '',
                dragOver: false,
                uploading: false,

                fileSelected(event) {
                    const file = event.target.files[0];
                    if (file) {
                        this.selectedFile = file;
                        this.selectedFileName = file.name;
                        this.selectedFileSize = this.formatFileSize(file.size);
                    }
                },

                handleDrop(event) {
                    this.dragOver = false;
                    const files = event.dataTransfer.files;
                    if (files.length > 0) {
                        const fileInput = document.getElementById('file-input');
                        fileInput.files = files;
                        this.fileSelected({ target: { files: files } });
                    }
                },

                clearFile() {
                    this.selectedFile = null;
                    this.selectedFileName = '';
                    this.selectedFileSize = '';
                    document.getElementById('file-input').value = '';
                },

                uploadStarted() {
                    this.uploading = true;
                },

                uploadFinished() {
                    this.uploading = false;
                    this.clearFile();
                },

                formatFileSize(bytes) {
                    if (bytes < 1024) return bytes + ' B';
                    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
                    if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
                    return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
                }
            }
        }
    </script>
</body>
</html>
