<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - File Processing System</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.6s ease-out;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md fade-in" x-data="loginApp()">
        <!-- Logo and Title -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-white rounded-full shadow-lg mb-4">
                <svg class="h-10 w-10 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                </svg>
            </div>
            <h1 class="text-4xl font-bold text-white mb-2">File Processing System</h1>
            <p class="text-indigo-100">Secure file upload and management</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">Sign In</h2>

            <!-- Login Form -->
            <form @submit.prevent="login" class="space-y-6">
                <!-- Username -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
                        Username
                    </label>
                    <input
                        x-model="username"
                        type="text"
                        id="username"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                        placeholder="Enter your username"
                    >
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        Password
                    </label>
                    <input
                        x-model="password"
                        type="password"
                        id="password"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                        placeholder="Enter your password"
                    >
                </div>

                <!-- Error Message -->
                <div x-show="error" x-text="error" class="p-4 bg-red-50 border border-red-200 rounded-lg text-red-600 text-sm"></div>

                <!-- Submit Button -->
                <button
                    type="submit"
                    :disabled="loading"
                    class="w-full bg-indigo-600 text-white py-3 px-4 rounded-lg font-semibold hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    <span x-show="!loading">Sign In</span>
                    <span x-show="loading" class="flex items-center justify-center">
                        <svg class="animate-spin h-5 w-5 mr-3" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
                        </svg>
                        Signing in...
                    </span>
                </button>
            </form>

            <!-- Demo Accounts -->
            <div class="mt-8 pt-6 border-t border-gray-200">
                <p class="text-sm font-medium text-gray-700 mb-3">Demo Accounts:</p>
                <div class="space-y-2">
                    <button
                        @click="fillCredentials('acme.user1', 'password')"
                        class="w-full text-left px-4 py-2 bg-gray-50 hover:bg-gray-100 rounded-lg text-sm transition"
                    >
                        <span class="font-medium text-gray-900">ACME User</span>
                        <span class="text-gray-500 ml-2">(Regular User)</span>
                    </button>
                    <button
                        @click="fillCredentials('acme.admin', 'password')"
                        class="w-full text-left px-4 py-2 bg-gray-50 hover:bg-gray-100 rounded-lg text-sm transition"
                    >
                        <span class="font-medium text-gray-900">ACME Admin</span>
                        <span class="text-gray-500 ml-2">(Org Administrator)</span>
                    </button>
                    <button
                        @click="fillCredentials('techstart.user1', 'password')"
                        class="w-full text-left px-4 py-2 bg-gray-50 hover:bg-gray-100 rounded-lg text-sm transition"
                    >
                        <span class="font-medium text-gray-900">TechStart User</span>
                        <span class="text-gray-500 ml-2">(Different Org)</span>
                    </button>
                </div>
            </div>

            <!-- Footer -->
            <div class="mt-6 text-center text-sm text-gray-500">
                <p>Protected by Keycloak Authentication</p>
            </div>
        </div>

        <!-- Info Card -->
        <div class="mt-6 bg-white bg-opacity-20 backdrop-blur-sm rounded-lg p-4 text-white text-sm">
            <div class="flex items-start">
                <svg class="h-5 w-5 mr-2 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
                </svg>
                <div>
                    <p class="font-medium mb-1">Multi-Organization Support</p>
                    <p class="text-indigo-100 text-xs">Each organization has isolated data. Organization admins can manage users via the Keycloak admin console.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function loginApp() {
            return {
                username: '',
                password: '',
                loading: false,
                error: '',
                keycloakUrl: /*[[${keycloakUrl}]]*/ 'http://localhost:8180',
                realm: /*[[${realm}]]*/ 'file-processing',
                clientId: /*[[${clientId}]]*/ 'upload-web-app',

                fillCredentials(username, password) {
                    this.username = username;
                    this.password = password;
                    this.error = '';
                },

                async login() {
                    this.loading = true;
                    this.error = '';

                    try {
                        // Get token from Keycloak
                        const tokenUrl = `${this.keycloakUrl}/realms/${this.realm}/protocol/openid-connect/token`;

                        const formData = new URLSearchParams();
                        formData.append('client_id', this.clientId);
                        formData.append('grant_type', 'password');
                        formData.append('username', this.username);
                        formData.append('password', this.password);

                        const response = await fetch(tokenUrl, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/x-www-form-urlencoded',
                            },
                            body: formData.toString()
                        });

                        if (!response.ok) {
                            throw new Error('Invalid username or password');
                        }

                        const data = await response.json();

                        // Store token in sessionStorage
                        sessionStorage.setItem('access_token', data.access_token);
                        sessionStorage.setItem('refresh_token', data.refresh_token);

                        // Redirect to dashboard
                        window.location.href = '/dashboard';

                    } catch (error) {
                        this.error = error.message || 'Login failed. Please try again.';
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
