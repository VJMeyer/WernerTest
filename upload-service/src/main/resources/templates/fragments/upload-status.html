<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Upload Status Fragment (polled via HTMX) -->
    <div th:fragment="status"
         th:attr="hx-get=${isComplete or isFailed ? null : '/htmx/upload-status/' + uploadId},
                  hx-trigger=${isComplete or isFailed ? null : 'every 2s'},
                  hx-swap='outerHTML'"
         class="space-y-4">

        <!-- File Info -->
        <div class="flex items-start justify-between">
            <div class="flex items-center">
                <div class="flex-shrink-0">
                    <svg class="h-10 w-10 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" clip-rule="evenodd"/>
                    </svg>
                </div>
                <div class="ml-4">
                    <p class="text-sm font-medium text-gray-900" th:text="${filename}">filename.csv</p>
                    <p class="text-sm text-gray-500" th:text="${fileSize}">1.5 MB</p>
                </div>
            </div>

            <!-- Status Badge -->
            <div>
                <span th:if="${statusText == 'UPLOADING'}"
                      class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
                    <svg class="animate-spin -ml-1 mr-2 h-3 w-3" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
                    </svg>
                    Uploading
                </span>

                <span th:if="${statusText == 'PROCESSING'}"
                      class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800">
                    <svg class="animate-spin -ml-1 mr-2 h-3 w-3" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
                    </svg>
                    Processing
                </span>

                <span th:if="${statusText == 'COMPLETED'}"
                      class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800">
                    <svg class="-ml-1 mr-2 h-3 w-3" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                    </svg>
                    Completed
                </span>

                <span th:if="${statusText == 'FAILED'}"
                      class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-red-100 text-red-800">
                    <svg class="-ml-1 mr-2 h-3 w-3" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                    </svg>
                    Failed
                </span>
            </div>
        </div>

        <!-- Progress Bar -->
        <div th:if="${!isComplete and !isFailed}">
            <div class="flex items-center justify-between text-sm text-gray-600 mb-2">
                <span>Progress</span>
                <span th:text="${progress + '%'}">0%</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2.5">
                <div
                    class="bg-primary-600 h-2.5 rounded-full progress-animate transition-all duration-300"
                    th:style="'width: ' + ${progress} + '%'"
                ></div>
            </div>
        </div>

        <!-- Completion Message -->
        <div th:if="${isComplete}" class="bg-green-50 border border-green-200 rounded-lg p-4">
            <div class="flex">
                <svg class="h-5 w-5 text-green-400" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                </svg>
                <div class="ml-3">
                    <p class="text-sm font-medium text-green-800">
                        File processed successfully!
                    </p>
                    <p class="mt-1 text-sm text-green-700">
                        Your file has been uploaded and is being processed by the batch system.
                    </p>
                </div>
            </div>
        </div>

        <!-- Admin Info (only visible to admins) -->
        <div th:if="${showAdminInfo}" class="border-t border-gray-200 pt-4">
            <h4 class="text-sm font-medium text-gray-700 mb-2">Admin Information</h4>
            <dl class="grid grid-cols-2 gap-4 text-sm">
                <div>
                    <dt class="text-gray-500">Uploaded By</dt>
                    <dd class="text-gray-900 font-medium" th:text="${uploadedBy}">username</dd>
                </div>
                <div>
                    <dt class="text-gray-500">Organization</dt>
                    <dd class="text-gray-900 font-medium" th:text="${organization}">Organization</dd>
                </div>
                <div>
                    <dt class="text-gray-500">Upload ID</dt>
                    <dd class="text-gray-900 font-mono text-xs" th:text="${uploadId}">upload-id</dd>
                </div>
            </dl>
        </div>
    </div>
</body>
</html>
