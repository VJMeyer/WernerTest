<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Success Fragment -->
    <div th:fragment="success" class="slide-in">
        <div class="bg-green-50 border-l-4 border-green-400 p-4 rounded-lg">
            <div class="flex">
                <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-green-400" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                    </svg>
                </div>
                <div class="ml-3 flex-1">
                    <p class="text-sm font-medium text-green-800">
                        File uploaded successfully!
                    </p>
                    <p class="mt-1 text-sm text-green-700">
                        <span th:text="${filename}">filename.csv</span>
                        (<span th:text="${#numbers.formatDecimal(size / 1024.0 / 1024.0, 1, 2)}">0.00</span> MB)
                    </p>
                </div>
            </div>
        </div>

        <!-- Upload Status Monitoring -->
        <div class="mt-6 bg-white border border-gray-200 rounded-lg p-6">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold text-gray-900">Upload Status</h3>
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
                    Monitoring
                </span>
            </div>

            <!-- HTMX polling for upload status -->
            <div
                th:attr="hx-get=${statusUrl},hx-trigger='load, every 2s',hx-swap='outerHTML'"
                class="space-y-3"
            >
                <div class="flex items-center justify-center py-8">
                    <svg class="animate-spin h-8 w-8 text-primary-600" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
                    </svg>
                    <span class="ml-3 text-gray-600">Loading status...</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
