# Server Configuration
server.port=8080
spring.application.name=upload-service

# Java 21 Virtual Threads Configuration
spring.threads.virtual.enabled=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
upload.directory=/app/uploads

# TUS Protocol Configuration (Resumable Uploads)
tus.upload.directory=/app/tus-uploads
tus.upload.expiration.period=86400000
tus.max.upload.size=104857600

# Redis Configuration (for distributed upload status tracking)
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.timeout=60000
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# RabbitMQ Configuration
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# HA Configuration - Publisher Confirms & Message Persistence
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Custom RabbitMQ Properties
rabbitmq.queue.file-upload=file.upload.queue
rabbitmq.exchange.file-processing=file.processing.exchange
rabbitmq.routing.key.file-upload=file.upload

# OAuth2 / Keycloak Configuration (JWT Authentication)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/file-processing
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/file-processing/protocol/openid-connect/certs
keycloak.auth-server-url=http://localhost:8180
keycloak.realm=file-processing
keycloak.resource=upload-service

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.de.kisters.hmt.cloud=INFO
logging.level.org.springframework.amqp=INFO
logging.level.org.springframework.security=DEBUG
