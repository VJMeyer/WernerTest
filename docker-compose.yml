version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - file-processing-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  upload-service:
    build:
      context: .
      dockerfile: upload-service/Dockerfile
    container_name: upload-service
    ports:
      - "8080:8080"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    volumes:
      - upload_data:/app/uploads
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - file-processing-network
    restart: on-failure

  batch-processor:
    build:
      context: .
      dockerfile: batch-processor/Dockerfile
    container_name: batch-processor
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      WISKBAT_ENABLED: "false"  # Set to true when wiskBat is available
    volumes:
      - upload_data:/app/uploads
      - batch_data:/app/batch
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - file-processing-network
    restart: on-failure

volumes:
  rabbitmq_data:
  upload_data:
  batch_data:

networks:
  file-processing-network:
    driver: bridge
