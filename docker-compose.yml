version: '3.8'

services:
  # Redis - Distributed state store (can be clustered for HA)
  redis:
    image: redis:7-alpine
    container_name: upload-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - upload-network

  # RabbitMQ - Message broker for event persistence
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: upload-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - upload-network

  # Upload Service - Instance 1
  upload-service-1:
    build: .
    container_name: upload-service-1
    ports:
      - "8081:8080"
    environment:
      - SERVER_PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=admin123
      - UPLOAD_STORAGE_PATH=/mnt/nfs/uploads
      - UPLOAD_BASE_URL=http://localhost:8081
    volumes:
      - shared_uploads:/mnt/nfs/uploads
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - upload-network
    restart: unless-stopped

  # Upload Service - Instance 2
  upload-service-2:
    build: .
    container_name: upload-service-2
    ports:
      - "8082:8080"
    environment:
      - SERVER_PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=admin123
      - UPLOAD_STORAGE_PATH=/mnt/nfs/uploads
      - UPLOAD_BASE_URL=http://localhost:8082
    volumes:
      - shared_uploads:/mnt/nfs/uploads
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - upload-network
    restart: unless-stopped

  # Upload Service - Instance 3
  upload-service-3:
    build: .
    container_name: upload-service-3
    ports:
      - "8083:8080"
    environment:
      - SERVER_PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=admin123
      - UPLOAD_STORAGE_PATH=/mnt/nfs/uploads
      - UPLOAD_BASE_URL=http://localhost:8083
    volumes:
      - shared_uploads:/mnt/nfs/uploads
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - upload-network
    restart: unless-stopped

  # Load Balancer (nginx) - Optional for production
  nginx:
    image: nginx:alpine
    container_name: upload-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - upload-service-1
      - upload-service-2
      - upload-service-3
    networks:
      - upload-network
    restart: unless-stopped

networks:
  upload-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  shared_uploads:
    driver: local
    # In production, this would be mounted from NFS
    # driver_opts:
    #   type: nfs
    #   o: addr=nfs-server.example.com,nolock,soft,rw
    #   device: ":/exports/uploads"
