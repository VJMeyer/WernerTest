# PostgreSQL DataSource Configuration for Karaf
# Place this file in $KARAF_HOME/etc/org.ops4j.datasource-AppDataSource.cfg

osgi.jdbc.driver.class = org.postgresql.Driver
dataSourceName = AppDataSource
url = jdbc:postgresql://localhost:5432/appdb
user = postgres
password = postgres

# Connection pool settings
pool = hikari
maximumPoolSize = 20
minimumIdle = 5
idleTimeout = 30000
connectionTimeout = 30000
maxLifetime = 1800000
