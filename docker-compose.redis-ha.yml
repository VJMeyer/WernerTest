version: '3.8'

# Redis High Availability with Sentinel
# This configuration provides Redis HA with 1 master, 2 replicas, and 3 sentinels
# Use this for production deployments requiring no single point of failure

services:
  redis-master:
    image: redis:7-alpine
    container_name: redis-master
    command: >
      redis-server
      --appendonly yes
      --appendfilename "appendonly.aof"
      --requirepass redis_password
      --masterauth redis_password
    volumes:
      - redis_master_data:/data
    networks:
      - file-processing-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis-replica-1:
    image: redis:7-alpine
    container_name: redis-replica-1
    command: >
      redis-server
      --appendonly yes
      --appendfilename "appendonly.aof"
      --requirepass redis_password
      --masterauth redis_password
      --replicaof redis-master 6379
    volumes:
      - redis_replica1_data:/data
    depends_on:
      - redis-master
    networks:
      - file-processing-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis-replica-2:
    image: redis:7-alpine
    container_name: redis-replica-2
    command: >
      redis-server
      --appendonly yes
      --appendfilename "appendonly.aof"
      --requirepass redis_password
      --masterauth redis_password
      --replicaof redis-master 6379
    volumes:
      - redis_replica2_data:/data
    depends_on:
      - redis-master
    networks:
      - file-processing-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis-sentinel-1:
    image: redis:7-alpine
    container_name: redis-sentinel-1
    command: >
      sh -c "echo 'port 26379
      sentinel monitor mymaster redis-master 6379 2
      sentinel auth-pass mymaster redis_password
      sentinel down-after-milliseconds mymaster 5000
      sentinel parallel-syncs mymaster 1
      sentinel failover-timeout mymaster 10000' > /tmp/sentinel.conf &&
      redis-sentinel /tmp/sentinel.conf"
    depends_on:
      - redis-master
    networks:
      - file-processing-network
    restart: unless-stopped

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: redis-sentinel-2
    command: >
      sh -c "echo 'port 26379
      sentinel monitor mymaster redis-master 6379 2
      sentinel auth-pass mymaster redis_password
      sentinel down-after-milliseconds mymaster 5000
      sentinel parallel-syncs mymaster 1
      sentinel failover-timeout mymaster 10000' > /tmp/sentinel.conf &&
      redis-sentinel /tmp/sentinel.conf"
    depends_on:
      - redis-master
    networks:
      - file-processing-network
    restart: unless-stopped

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: redis-sentinel-3
    command: >
      sh -c "echo 'port 26379
      sentinel monitor mymaster redis-master 6379 2
      sentinel auth-pass mymaster redis_password
      sentinel down-after-milliseconds mymaster 5000
      sentinel parallel-syncs mymaster 1
      sentinel failover-timeout mymaster 10000' > /tmp/sentinel.conf &&
      redis-sentinel /tmp/sentinel.conf"
    depends_on:
      - redis-master
    networks:
      - file-processing-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - file-processing-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  upload-service:
    build:
      context: .
      dockerfile: upload-service/Dockerfile
    container_name: upload-service
    ports:
      - "8080:8080"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      # Redis Sentinel configuration
      SPRING_DATA_REDIS_SENTINEL_MASTER: mymaster
      SPRING_DATA_REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      SPRING_DATA_REDIS_PASSWORD: redis_password
    volumes:
      - upload_data:/app/uploads
    depends_on:
      redis-master:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - file-processing-network
    restart: on-failure

  batch-processor:
    build:
      context: .
      dockerfile: batch-processor/Dockerfile
    container_name: batch-processor
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      WISKBAT_ENABLED: "false"
    volumes:
      - upload_data:/app/uploads
      - batch_data:/app/batch
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - file-processing-network
    restart: on-failure

volumes:
  redis_master_data:
  redis_replica1_data:
  redis_replica2_data:
  rabbitmq_data:
  upload_data:
  batch_data:

networks:
  file-processing-network:
    driver: bridge
