events {
    worker_connections 1024;
}

http {
    upstream upload_backend {
        # Round-robin load balancing across all 3 instances
        server upload-service-1:8080;
        server upload-service-2:8080;
        server upload-service-3:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Increase max body size for file uploads
        client_max_body_size 100M;

        # Timeouts for large file uploads
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;

        location / {
            proxy_pass http://upload_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for better upload progress tracking
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://upload_backend/api/uploads/health;
            proxy_set_header Host $host;
        }
    }
}
