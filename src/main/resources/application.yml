server:
  port: 8080
  # Enable virtual threads for high concurrency (Java 21)
  tomcat:
    threads:
      max: 200
  # Disable response buffering for true streaming
  compression:
    enabled: false

spring:
  application:
    name: high-speed-database-exporter

  # Enable virtual threads (Java 21 feature)
  threads:
    virtual:
      enabled: true

  # Database configuration - auto-detects type from URL
  # Uncomment ONE of the following datasource configurations:
  datasource:
    # ========== PostgreSQL Configuration ==========
    url: jdbc:postgresql://localhost:5432/your_database
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

    # ========== Oracle Configuration (uncomment to use) ==========
    # url: jdbc:oracle:thin:@//localhost:1521/ORCL
    # username: ${DB_USERNAME:system}
    # password: ${DB_PASSWORD:oracle}
    # driver-class-name: oracle.jdbc.OracleDriver

    # ========== MSSQL Configuration (uncomment to use) ==========
    # url: jdbc:sqlserver://localhost:1433;databaseName=your_database;encrypt=false;responseBuffering=adaptive
    # username: ${DB_USERNAME:sa}
    # password: ${DB_PASSWORD:YourPassword123}
    # driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

    # HikariCP connection pool optimization
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # Note: auto-commit is configured dynamically based on database type
      # PostgreSQL: requires auto-commit=false for server-side cursors
      # Oracle: works with auto-commit=true
      # MSSQL: auto-commit=false for cursor behavior

  # Jackson configuration
  jackson:
    serialization:
      indent-output: false
    default-property-inclusion: non_null

# Custom exporter configuration
exporter:
  # JDBC fetch size for cursor-based streaming
  # This controls how many rows are fetched from the database at a time
  fetch-size: 10000

  # Buffer size for output stream (in bytes)
  buffer-size: 65536

  # Lookup cache configuration
  cache:
    # Maximum number of entries per lookup table
    max-size: 1000
    # Time to live in seconds (refresh interval)
    ttl-seconds: 3600

  # Streaming configuration
  streaming:
    # Flush output every N records
    flush-interval: 1000
    # Enable gzip compression for responses
    gzip-enabled: false

# Actuator endpoints for monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging configuration
logging:
  level:
    com.example.exporter: INFO
    org.springframework.jdbc: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
