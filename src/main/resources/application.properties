# Server Configuration
server.port=8080
spring.application.name=spring-rabbitmq-app

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Custom RabbitMQ Properties
rabbitmq.queue.name=message.queue
rabbitmq.exchange.name=message.exchange
rabbitmq.routing.key=message.routing.key

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.com.example.rabbitmq=INFO
logging.level.org.springframework.amqp=INFO
