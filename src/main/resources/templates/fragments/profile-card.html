<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="profile-card" class="profile-info">
    <div class="avatar"
         th:text="${userInfo.username != null ? userInfo.username.substring(0,1).toUpperCase() : 'U'}">U</div>
    <div class="info-list">
        <div class="info-item">
            <span class="info-label">Username</span>
            <span class="info-value" th:text="${userInfo.username ?: 'N/A'}">N/A</span>
        </div>
        <div class="info-item">
            <span class="info-label">Email</span>
            <span class="info-value" th:text="${userInfo.email ?: 'N/A'}">N/A</span>
        </div>
        <div class="info-item">
            <span class="info-label">Name</span>
            <span class="info-value" th:text="${userInfo.name ?: 'N/A'}">N/A</span>
        </div>
        <div class="info-item">
            <span class="info-label">Email Verified</span>
            <span th:if="${userInfo.emailVerified}" class="info-value badge badge-success">Yes</span>
            <span th:unless="${userInfo.emailVerified}" class="info-value badge badge-warning">No</span>
        </div>
    </div>
</div>
</body>
</html>
