<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Profile</title>
</head>
<body>
<div layout:fragment="content">
    <div class="profile-page">
        <div class="profile-header">
            <div class="profile-avatar-large"
                 th:text="${userInfo.username != null ? userInfo.username.substring(0,1).toUpperCase() : 'U'}">U</div>
            <h1 th:text="${userInfo.name ?: userInfo.username ?: 'User'}">User</h1>
            <p class="profile-subtitle" th:text="${userInfo.email ?: ''}"></p>
        </div>

        <div class="profile-content">
            <div class="profile-section">
                <h2>Account Information</h2>
                <div class="profile-details">
                    <div class="detail-row">
                        <div class="detail-label">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            Username
                        </div>
                        <div class="detail-value" th:text="${userInfo.username ?: 'N/A'}">N/A</div>
                    </div>

                    <div class="detail-row">
                        <div class="detail-label">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                            Email
                        </div>
                        <div class="detail-value">
                            <span th:text="${userInfo.email ?: 'N/A'}">N/A</span>
                            <span th:if="${userInfo.emailVerified}" class="badge badge-success">Verified</span>
                            <span th:unless="${userInfo.emailVerified}" class="badge badge-warning">Not Verified</span>
                        </div>
                    </div>

                    <div class="detail-row">
                        <div class="detail-label">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="2" y1="12" x2="22" y2="12"></line>
                                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                            </svg>
                            Full Name
                        </div>
                        <div class="detail-value" th:text="${userInfo.name ?: 'N/A'}">N/A</div>
                    </div>

                    <div class="detail-row">
                        <div class="detail-label">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                <circle cx="8.5" cy="7" r="4"></circle>
                                <polyline points="17 11 19 13 23 9"></polyline>
                            </svg>
                            Given Name
                        </div>
                        <div class="detail-value" th:text="${userInfo.givenName ?: 'N/A'}">N/A</div>
                    </div>

                    <div class="detail-row">
                        <div class="detail-label">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                            </svg>
                            Family Name
                        </div>
                        <div class="detail-value" th:text="${userInfo.familyName ?: 'N/A'}">N/A</div>
                    </div>

                    <div class="detail-row">
                        <div class="detail-label">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="16" y1="2" x2="16" y2="6"></line>
                                <line x1="8" y1="2" x2="8" y2="6"></line>
                                <line x1="3" y1="10" x2="21" y2="10"></line>
                            </svg>
                            Subject ID
                        </div>
                        <div class="detail-value monospace" th:text="${userInfo.subject ?: 'N/A'}">N/A</div>
                    </div>
                </div>
            </div>

            <div class="profile-actions">
                <a th:href="@{/dashboard}" class="btn btn-outline">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Back to Dashboard
                </a>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-danger">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        Logout
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
